version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: soundwave-backend
    ports:
      - "6001:6001"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    networks:
      - soundwave-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: soundwave-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - soundwave-net

networks:
  soundwave-net:
    driver: bridge
